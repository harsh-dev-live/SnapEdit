<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SnapEdit — Offline Photo Editor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#101114;
    --panel:#181a1f;
    --panel2:#20232a;
    --text:#fff;
    --muted:#9297a3;
    --accent:#ffcc00;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#15161a;
    border-bottom:1px solid #292c32;
    position:relative;
    z-index:20;
}

.logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--accent);
}

.header-actions{
    display:flex;
    gap:8px;
}

.top-btn{
    background:#25282e;
    color:#fff;
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
}

.top-btn:hover{
    background:#32353c;
}

.top-btn.primary{
    background:var(--accent);
    color:#111;
    font-weight:700;
}

/* WORKSPACE */

.workspace{
    flex:1;
    display:flex;
    min-height:calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar{
    width:300px;
    background:#15161a;
    border-right:1px solid #292c32;
    padding:20px;
    overflow-y:auto;
}

.sidebar h3{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:16px;
}

.control{
    margin-bottom:20px;
}

.control-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:13px;
}

.value{
    color:var(--accent);
    font-weight:bold;
}

input[type="range"]{
    width:100%;
    accent-color:var(--accent);
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:25px;
}

.tool{
    background:#23262c;
    color:#ddd;
    padding:12px 4px;
    border-radius:10px;
    font-size:11px;
    text-align:center;
}

.tool:hover{
    background:#30343b;
}

.tool:active{
    transform:scale(.96);
}

/* CANVAS AREA */

.canvas-area{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    position:relative;
    background:
        radial-gradient(circle at center,#20232a 0%,#111216 60%);
    overflow:auto;
}

.canvas-wrapper{
    position:relative;
    max-width:100%;
    max-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#canvas{
    display:block;
    max-width:min(85vw,1100px);
    max-height:75vh;
    width:auto;
    height:auto;
    background:#222;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* UPLOAD */

.upload-screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.upload-box{
    width:min(600px,90vw);
    min-height:330px;
    border:2px dashed #555a65;
    border-radius:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    background:rgba(30,32,38,.75);
    transition:.2s;
}

.upload-box.dragging{
    border-color:var(--accent);
    background:rgba(255,204,0,.08);
    transform:scale(1.02);
}

.upload-icon{
    width:80px;
    height:80px;
    border-radius:22px;
    background:#292c32;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    margin-bottom:20px;
}

.upload-box h1{
    font-size:25px;
    margin-bottom:10px;
}

.upload-box p{
    color:var(--muted);
    line-height:1.6;
    font-size:14px;
    margin-bottom:25px;
}

.upload-button{
    background:var(--accent);
    color:#111;
    padding:13px 24px;
    border-radius:12px;
    font-weight:700;
}

.upload-button:hover{
    filter:brightness(1.1);
}

#fileInput{
    display:none;
}

/* EMPTY STATE */

.hidden{
    display:none!important;
}

/* BOTTOM TOOLS */

.bottom-bar{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#191b20;
    border:1px solid #30333a;
    border-radius:15px;
    padding:7px;
    display:flex;
    gap:5px;
    box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.bottom-btn{
    background:transparent;
    color:#ddd;
    padding:9px 13px;
    border-radius:9px;
    font-size:12px;
}

.bottom-btn:hover{
    background:#2a2d33;
}

.bottom-btn.active{
    background:var(--accent);
    color:#111;
}

/* MOBILE */

@media(max-width:900px){

    .workspace{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:0;
        border-top:1px solid #292c32;
        order:2;
        padding:16px;
    }

    .canvas-area{
        min-height:55vh;
        padding:15px;
        order:1;
    }

    #canvas{
        max-width:95vw;
        max-height:55vh;
    }

    .tool-grid{
        grid-template-columns:repeat(6,1fr);
    }

    .control{
        margin-bottom:14px;
    }

    .bottom-bar{
        position:fixed;
        bottom:10px;
        width:calc(100% - 20px);
        justify-content:center;
        overflow:auto;
    }

    .bottom-btn{
        white-space:nowrap;
    }
}

@media(max-width:500px){

    .header{
        padding:0 12px;
    }

    .logo{
        font-size:17px;
    }

    .top-btn{
        padding:8px 10px;
        font-size:11px;
    }

    .upload-box{
        min-height:280px;
        padding:25px;
    }

    .upload-box h1{
        font-size:21px;
    }

    .tool-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        Snap<span>Edit</span>
    </div>

    <div class="header-actions">
        <button class="top-btn" id="resetBtn">
            Reset
        </button>

        <button class="top-btn primary" id="downloadBtn">
            Download
        </button>
    </div>

</header>


<div class="workspace">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h3>Adjust</h3>

        <div class="control">

            <div class="control-row">
                <span>Brightness</span>
                <span class="value" id="brightnessValue">0</span>
            </div>

            <input
                type="range"
                id="brightness"
                min="-100"
                max="100"
                value="0"
            >

        </div>


        <div class="control">

            <div class="control-row">
                <span>Contrast</span>
                <span class="value" id="contrastValue">0</span>
            </div>

            <input
                type="range"
                id="contrast"
                min="-100"
                max="100"
                value="0"
            >

        </div>


        <div class="control">

            <div class="control-row">
                <span>Saturation</span>
                <span class="value" id="saturationValue">0</span>
            </div>

            <input
                type="range"
                id="saturation"
                min="-100"
                max="100"
                value="0"
            >

        </div>


        <div class="control">

            <div class="control-row">
                <span>Warmth</span>
                <span class="value" id="warmthValue">0</span>
            </div>

            <input
                type="range"
                id="warmth"
                min="-100"
                max="100"
                value="0"
            >

        </div>


        <div class="control">

            <div class="control-row">
                <span>Sharpness</span>
                <span class="value" id="sharpnessValue">0</span>
            </div>

            <input
                type="range"
                id="sharpness"
                min="0"
                max="100"
                value="0"
            >

        </div>


        <h3>Tools</h3>

        <div class="tool-grid">

            <button class="tool" id="rotateLeft">
                ↶<br>Rotate
            </button>

            <button class="tool" id="rotateRight">
                ↷<br>Rotate
            </button>

            <button class="tool" id="flipH">
                ↔<br>Flip
            </button>

            <button class="tool" id="grayscale">
                ◐<br>B&W
            </button>

            <button class="tool" id="sepia">
                🟤<br>Sepia
            </button>

            <button class="tool" id="resetAdjust">
                ⟳<br>Clear
            </button>

        </div>

    </aside>


    <!-- CANVAS -->

    <main class="canvas-area" id="canvasArea">

        <div
            class="upload-screen"
            id="uploadScreen"
        >

            <div
                class="upload-box"
                id="uploadBox"
            >

                <div class="upload-icon">
                    🖼️
                </div>

                <h1>Open a Photo</h1>

                <p>
                    Upload an image to start editing.
                    Everything runs locally in your browser.
                    Your photo is never uploaded to a server.
                </p>

                <button
                    class="upload-button"
                    id="uploadButton"
                    type="button"
                >
                    Choose Photo
                </button>

            </div>

        </div>


        <div class="canvas-wrapper hidden" id="canvasWrapper">

            <canvas id="canvas"></canvas>

        </div>


        <div class="bottom-bar hidden" id="bottomBar">

            <button class="bottom-btn" id="newPhotoBtn">
                + New Photo
            </button>

            <button class="bottom-btn" id="jpgBtn">
                JPG
            </button>

            <button class="bottom-btn" id="pngBtn">
                PNG
            </button>

        </div>

    </main>

</div>

</div>


<!-- IMPORTANT:
     The input is outside the upload box.
     This avoids browser click/label problems.
-->

<input
    type="file"
    id="fileInput"
    accept="image/*"
>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const fileInput = document.getElementById("fileInput");

const uploadButton = document.getElementById("uploadButton");

const uploadBox = document.getElementById("uploadBox");

const uploadScreen = document.getElementById("uploadScreen");

const canvasArea = document.getElementById("canvasArea");

const canvasWrapper = document.getElementById("canvasWrapper");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d", {
    willReadFrequently:true
});

const bottomBar = document.getElementById("bottomBar");

const downloadBtn = document.getElementById("downloadBtn");

const resetBtn = document.getElementById("resetBtn");

const newPhotoBtn = document.getElementById("newPhotoBtn");


/* =========================================================
   STATE
========================================================= */

let originalImage = null;

let rotation = 0;

let flipX = 1;

let filterState = {

    brightness:0,

    contrast:0,

    saturation:0,

    warmth:0,

    sharpness:0,

    grayscale:false,

    sepia:false

};


/* =========================================================
   UPLOAD
========================================================= */

/*
    Open file picker.
*/

uploadButton.addEventListener("click", function(e){

    e.stopPropagation();

    fileInput.click();

});


/*
    Clicking anywhere inside upload box also opens picker.
*/

uploadBox.addEventListener("click", function(e){

    if(e.target === uploadButton){
        return;
    }

    fileInput.click();

});


/*
    File selected.
*/

fileInput.addEventListener("change", function(){

    const file = this.files && this.files[0];

    if(!file){
        return;
    }

    loadImageFile(file);

});


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImageFile(file){

    /*
        Make sure this is actually an image.
    */

    if(!file.type.startsWith("image/")){

        alert("Please select an image file.");

        return;

    }


    /*
        FileReader works locally and avoids server requirements.
    */

    const reader = new FileReader();


    reader.onload = function(event){

        const img = new Image();


        img.onload = function(){

            originalImage = img;

            rotation = 0;

            flipX = 1;

            resetFilterState(false);

            uploadScreen.classList.add("hidden");

            canvasWrapper.classList.remove("hidden");

            bottomBar.classList.remove("hidden");

            drawImage();

        };


        img.onerror = function(){

            alert("This image could not be opened.");

        };


        img.src = event.target.result;

    };


    reader.onerror = function(){

        alert("Could not read this file.");

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   DRAG & DROP
========================================================= */

[
    "dragenter",
    "dragover"
].forEach(function(eventName){

    uploadBox.addEventListener(eventName, function(e){

        e.preventDefault();

        e.stopPropagation();

        uploadBox.classList.add("dragging");

    });

});


[
    "dragleave",
    "drop"
].forEach(function(eventName){

    uploadBox.addEventListener(eventName, function(e){

        e.preventDefault();

        e.stopPropagation();

        uploadBox.classList.remove("dragging");

    });

});


uploadBox.addEventListener("drop", function(e){

    const files = e.dataTransfer.files;

    if(!files || !files.length){
        return;
    }

    loadImageFile(files[0]);

});


/* =========================================================
   DRAW IMAGE
========================================================= */

function drawImage(){

    if(!originalImage){
        return;
    }


    const imgW = originalImage.naturalWidth;

    const imgH = originalImage.naturalHeight;


    /*
        Rotation determines output dimensions.
    */

    const rotated =
        rotation === 90 ||
        rotation === 270;


    const outputW = rotated ? imgH : imgW;

    const outputH = rotated ? imgW : imgH;


    canvas.width = outputW;

    canvas.height = outputH;


    ctx.save();


    /*
        Center canvas.
    */

    ctx.translate(
        outputW / 2,
        outputH / 2
    );


    /*
        Rotation.
    */

    ctx.rotate(
        rotation * Math.PI / 180
    );


    /*
        Flip.
    */

    ctx.scale(
        flipX,
        1
    );


    /*
        Filters.
    */

    const brightness =
        100 + filterState.brightness;

    const contrast =
        100 + filterState.contrast;

    const saturation =
        100 + filterState.saturation;


    let filterString =
        `brightness(${brightness}%) ` +
        `contrast(${contrast}%) ` +
        `saturate(${saturation}%)`;


    if(filterState.grayscale){

        filterString += " grayscale(100%)";

    }


    if(filterState.sepia){

        filterString += " sepia(100%)";

    }


    ctx.filter = filterString;


    /*
        Warmth is implemented using a subtle
        color overlay after the image.
    */

    ctx.drawImage(
        originalImage,
        -imgW / 2,
        -imgH / 2,
        imgW,
        imgH
    );


    ctx.filter = "none";


    /*
        Warmth overlay.
    */

    if(filterState.warmth !== 0){

        const alpha =
            Math.abs(filterState.warmth) / 100 * .25;


        ctx.globalCompositeOperation =
            "soft-light";


        if(filterState.warmth > 0){

            ctx.fillStyle =
                `rgba(255,145,40,${alpha})`;

        }else{

            ctx.fillStyle =
                `rgba(30,150,255,${alpha})`;

        }


        ctx.fillRect(
            -outputW,
            -outputH,
            outputW * 2,
            outputH * 2
        );


        ctx.globalCompositeOperation =
            "source-over";

    }


    ctx.restore();


    /*
        Simple sharpness enhancement.
    */

    if(filterState.sharpness > 0){

        applySharpness();

    }

}


/* =========================================================
   SHARPNESS
========================================================= */

function applySharpness(){

    const amount =
        filterState.sharpness / 100;


    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data = image.data;

    const copy =
        new Uint8ClampedArray(data);


    const w = canvas.width;

    const h = canvas.height;


    for(let y = 1; y < h - 1; y++){

        for(let x = 1; x < w - 1; x++){

            const i =
                (y * w + x) * 4;


            for(let c = 0; c < 3; c++){

                const center =
                    copy[i + c];

                const top =
                    copy[i - w * 4 + c];

                const bottom =
                    copy[i + w * 4 + c];

                const left =
                    copy[i - 4 + c];

                const right =
                    copy[i + 4 + c];


                const sharpened =
                    center * (1 + 4 * amount)
                    - amount *
                    (top + bottom + left + right);


                data[i + c] =
                    Math.max(
                        0,
                        Math.min(
                            255,
                            sharpened
                        )
                    );

            }

        }

    }


    ctx.putImageData(image,0,0);

}


/* =========================================================
   SLIDERS
========================================================= */

const sliders = [

    ["brightness","brightnessValue"],

    ["contrast","contrastValue"],

    ["saturation","saturationValue"],

    ["warmth","warmthValue"],

    ["sharpness","sharpnessValue"]

];


sliders.forEach(function(item){

    const slider =
        document.getElementById(item[0]);

    const value =
        document.getElementById(item[1]);


    slider.addEventListener("input",function(){

        const number =
            Number(this.value);


        value.textContent =
            number;


        filterState[item[0]] =
            number;


        drawImage();

    });

});


/* =========================================================
   ROTATION
========================================================= */

document.getElementById("rotateLeft")
.addEventListener("click",function(){

    rotation -= 90;

    if(rotation < 0){
        rotation = 270;
    }

    drawImage();

});


document.getElementById("rotateRight")
.addEventListener("click",function(){

    rotation += 90;

    if(rotation >= 360){
        rotation = 0;
    }

    drawImage();

});


/* =========================================================
   FLIP
========================================================= */

document.getElementById("flipH")
.addEventListener("click",function(){

    flipX *= -1;

    drawImage();

});


/* =========================================================
   BLACK & WHITE
========================================================= */

document.getElementById("grayscale")
.addEventListener("click",function(){

    filterState.grayscale =
        !filterState.grayscale;

    drawImage();

});


/* =========================================================
   SEPIA
========================================================= */

document.getElementById("sepia")
.addEventListener("click",function(){

    filterState.sepia =
        !filterState.sepia;

    drawImage();

});


/* =========================================================
   RESET FILTERS
========================================================= */

function resetFilterState(redraw = true){

    filterState = {

        brightness:0,

        contrast:0,

        saturation:0,

        warmth:0,

        sharpness:0,

        grayscale:false,

        sepia:false

    };


    document.getElementById("brightness").value = 0;

    document.getElementById("contrast").value = 0;

    document.getElementById("saturation").value = 0;

    document.getElementById("warmth").value = 0;

    document.getElementById("sharpness").value = 0;


    document.getElementById("brightnessValue")
        .textContent = "0";

    document.getElementById("contrastValue")
        .textContent = "0";

    document.getElementById("saturationValue")
        .textContent = "0";

    document.getElementById("warmthValue")
        .textContent = "0";

    document.getElementById("sharpnessValue")
        .textContent = "0";


    if(redraw){
        drawImage();
    }

}


/* =========================================================
   RESET EVERYTHING
========================================================= */

resetBtn.addEventListener("click",function(){

    if(!originalImage){
        return;
    }

    rotation = 0;

    flipX = 1;

    resetFilterState();

});


document.getElementById("resetAdjust")
.addEventListener("click",function(){

    resetFilterState();

});


/* =========================================================
   NEW PHOTO
========================================================= */

newPhotoBtn.addEventListener("click",function(){

    fileInput.value = "";

    originalImage = null;

    canvasWrapper.classList.add("hidden");

    bottomBar.classList.add("hidden");

    uploadScreen.classList.remove("hidden");

});


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadImage(format){

    if(!originalImage){

        alert("Please upload an image first.");

        return;

    }


    const mime =
        format === "png"
        ? "image/png"
        : "image/jpeg";


    const extension =
        format === "png"
        ? "png"
        : "jpg";


    canvas.toBlob(function(blob){

        if(!blob){

            alert("Could not create the image.");

            return;

        }


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            `snapedit-${Date.now()}.${extension}`;


        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(function(){

            URL.revokeObjectURL(url);

        },1000);


    },mime,0.95);

}


downloadBtn.addEventListener("click",function(){

    downloadImage("jpg");

});


document.getElementById("jpgBtn")
.addEventListener("click",function(){

    downloadImage("jpg");

});


document.getElementById("pngBtn")
.addEventListener("click",function(){

    downloadImage("png");

});


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener("keydown",function(e){

    if(e.ctrlKey && e.key.toLowerCase() === "o"){

        e.preventDefault();

        fileInput.click();

    }


    if(e.ctrlKey && e.key.toLowerCase() === "s"){

        e.preventDefault();

        downloadImage("jpg");

    }


    if(e.key === "Escape"){

        resetFilterState();

    }

});


</script>

</body>
</html>
